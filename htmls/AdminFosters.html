<div class="fz-site fz-admin" id="fz-site" data-theme="light" style="{plhd_style}">
<header class="fz-ahead">
    <button type="button" class="fz-ibtn fz-burger" aria-label="Menu" onclick="AdminFostersJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="fz-abrand" href="Admin"><svg class="fz-logo" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="var(--fz-accent)"/><ellipse cx="20" cy="25.5" rx="7.2" ry="6" fill="#fff"/><ellipse cx="11.2" cy="18.2" rx="2.9" ry="3.6" fill="#fff" transform="rotate(-18 11.2 18.2)"/><ellipse cx="16.4" cy="12.4" rx="2.9" ry="3.8" fill="#fff" transform="rotate(-6 16.4 12.4)"/><ellipse cx="23.6" cy="12.4" rx="2.9" ry="3.8" fill="#fff" transform="rotate(6 23.6 12.4)"/><ellipse cx="28.8" cy="18.2" rx="2.9" ry="3.6" fill="#fff" transform="rotate(18 28.8 18.2)"/></svg>{plhd_name}<span>Admin</span></a>
    <span class="fz-grow"></span>
    <a class="fz-who" id="fz-who" href="AdminAccount"></a>
    <a class="fz-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="fz-out" onclick="AdminFostersJs.signOut()">Sign out</button>
</header>
<aside class="fz-side" id="fz-nav" aria-label="Admin">
    <div class="fz-nav-top"><span>Menu</span><button type="button" class="fz-ibtn" aria-label="Close" onclick="AdminFostersJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="fz-amenu" id="fz-menu"></ul>
</aside>
<div class="fz-scrim" id="fz-scrim" onclick="AdminFostersJs.closeNav()"></div>
<main class="fz-amain" id="fz-main"><p class="fz-loading">Loading&hellip;</p></main>
<div class="fz-modal" id="fz-modal" onclick="if(event.target===this)AdminFostersJs.closeModal()">
    <div class="fz-mbox" role="dialog" aria-modal="true"><button type="button" class="fz-ibtn fz-mclose" aria-label="Close" onclick="AdminFostersJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="fz-mbody"></div></div>
</div>
<div class="fz-toast" id="fz-toast" role="status" aria-live="polite"></div>
</div>
