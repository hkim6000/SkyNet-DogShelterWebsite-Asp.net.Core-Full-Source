<div class="us-site us-admin" id="us-site" data-theme="light" style="{plhd_style}">
<header class="us-ahead">
    <button type="button" class="us-ibtn us-burger" aria-label="Menu" onclick="AdminUsersJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="us-abrand" href="Admin"><svg class="us-logo" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="var(--us-accent)"/><ellipse cx="20" cy="25.5" rx="7.2" ry="6" fill="#fff"/><ellipse cx="11.2" cy="18.2" rx="2.9" ry="3.6" fill="#fff" transform="rotate(-18 11.2 18.2)"/><ellipse cx="16.4" cy="12.4" rx="2.9" ry="3.8" fill="#fff" transform="rotate(-6 16.4 12.4)"/><ellipse cx="23.6" cy="12.4" rx="2.9" ry="3.8" fill="#fff" transform="rotate(6 23.6 12.4)"/><ellipse cx="28.8" cy="18.2" rx="2.9" ry="3.6" fill="#fff" transform="rotate(18 28.8 18.2)"/></svg>{plhd_name}<span>Admin</span></a>
    <span class="us-grow"></span>
    <a class="us-who" id="us-who" href="AdminAccount"></a>
    <a class="us-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="us-out" onclick="AdminUsersJs.signOut()">Sign out</button>
</header>
<aside class="us-side" id="us-nav" aria-label="Admin">
    <div class="us-nav-top"><span>Menu</span><button type="button" class="us-ibtn" aria-label="Close" onclick="AdminUsersJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="us-amenu" id="us-menu"></ul>
</aside>
<div class="us-scrim" id="us-scrim" onclick="AdminUsersJs.closeNav()"></div>
<main class="us-amain" id="us-main"><p class="us-loading">Loading&hellip;</p></main>
<div class="us-modal" id="us-modal" onclick="if(event.target===this)AdminUsersJs.closeModal()">
    <div class="us-mbox" role="dialog" aria-modal="true"><button type="button" class="us-ibtn us-mclose" aria-label="Close" onclick="AdminUsersJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="us-mbody"></div></div>
</div>
<div class="us-toast" id="us-toast" role="status" aria-live="polite"></div>
</div>
