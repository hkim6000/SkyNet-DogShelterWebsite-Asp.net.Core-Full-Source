<div class="ms-site ms-admin" id="ms-site" data-theme="light" style="{plhd_style}">
<header class="ms-ahead">
    <button type="button" class="ms-ibtn ms-burger" aria-label="Menu" onclick="AdminMessagesJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="ms-abrand" href="Admin"><svg class="ms-logo" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="var(--ms-accent)"/><ellipse cx="20" cy="25.5" rx="7.2" ry="6" fill="#fff"/><ellipse cx="11.2" cy="18.2" rx="2.9" ry="3.6" fill="#fff" transform="rotate(-18 11.2 18.2)"/><ellipse cx="16.4" cy="12.4" rx="2.9" ry="3.8" fill="#fff" transform="rotate(-6 16.4 12.4)"/><ellipse cx="23.6" cy="12.4" rx="2.9" ry="3.8" fill="#fff" transform="rotate(6 23.6 12.4)"/><ellipse cx="28.8" cy="18.2" rx="2.9" ry="3.6" fill="#fff" transform="rotate(18 28.8 18.2)"/></svg>{plhd_name}<span>Admin</span></a>
    <span class="ms-grow"></span>
    <a class="ms-who" id="ms-who" href="AdminAccount"></a>
    <a class="ms-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="ms-out" onclick="AdminMessagesJs.signOut()">Sign out</button>
</header>
<aside class="ms-side" id="ms-nav" aria-label="Admin">
    <div class="ms-nav-top"><span>Menu</span><button type="button" class="ms-ibtn" aria-label="Close" onclick="AdminMessagesJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="ms-amenu" id="ms-menu"></ul>
</aside>
<div class="ms-scrim" id="ms-scrim" onclick="AdminMessagesJs.closeNav()"></div>
<main class="ms-amain" id="ms-main"><p class="ms-loading">Loading&hellip;</p></main>
<div class="ms-modal" id="ms-modal" onclick="if(event.target===this)AdminMessagesJs.closeModal()">
    <div class="ms-mbox" role="dialog" aria-modal="true"><button type="button" class="ms-ibtn ms-mclose" aria-label="Close" onclick="AdminMessagesJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="ms-mbody"></div></div>
</div>
<div class="ms-toast" id="ms-toast" role="status" aria-live="polite"></div>
</div>
