<div class="dz-site dz-admin" id="dz-site" data-theme="light" style="{plhd_style}">
<header class="dz-ahead">
    <button type="button" class="dz-ibtn dz-burger" aria-label="Menu" onclick="AdminDogsJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="dz-abrand" href="Admin"><svg class="dz-logo" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="var(--dz-accent)"/><ellipse cx="20" cy="25.5" rx="7.2" ry="6" fill="#fff"/><ellipse cx="11.2" cy="18.2" rx="2.9" ry="3.6" fill="#fff" transform="rotate(-18 11.2 18.2)"/><ellipse cx="16.4" cy="12.4" rx="2.9" ry="3.8" fill="#fff" transform="rotate(-6 16.4 12.4)"/><ellipse cx="23.6" cy="12.4" rx="2.9" ry="3.8" fill="#fff" transform="rotate(6 23.6 12.4)"/><ellipse cx="28.8" cy="18.2" rx="2.9" ry="3.6" fill="#fff" transform="rotate(18 28.8 18.2)"/></svg>{plhd_name}<span>Admin</span></a>
    <span class="dz-grow"></span>
    <a class="dz-who" id="dz-who" href="AdminAccount"></a>
    <a class="dz-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="dz-out" onclick="AdminDogsJs.signOut()">Sign out</button>
</header>
<aside class="dz-side" id="dz-nav" aria-label="Admin">
    <div class="dz-nav-top"><span>Menu</span><button type="button" class="dz-ibtn" aria-label="Close" onclick="AdminDogsJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="dz-amenu" id="dz-menu"></ul>
</aside>
<div class="dz-scrim" id="dz-scrim" onclick="AdminDogsJs.closeNav()"></div>
<main class="dz-amain" id="dz-main"><p class="dz-loading">Loading&hellip;</p></main>
<div class="dz-modal" id="dz-modal" onclick="if(event.target===this)AdminDogsJs.closeModal()">
    <div class="dz-mbox" role="dialog" aria-modal="true"><button type="button" class="dz-ibtn dz-mclose" aria-label="Close" onclick="AdminDogsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="dz-mbody"></div></div>
</div>
<div class="dz-toast" id="dz-toast" role="status" aria-live="polite"></div>
</div>
