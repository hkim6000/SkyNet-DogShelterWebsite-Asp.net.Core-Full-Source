<div class="st-site st-admin" id="st-site" data-theme="light" style="{plhd_style}">
<header class="st-ahead">
    <button type="button" class="st-ibtn st-burger" aria-label="Menu" onclick="AdminSettingsJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="st-abrand" href="Admin"><svg class="st-logo" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="var(--st-accent)"/><ellipse cx="20" cy="25.5" rx="7.2" ry="6" fill="#fff"/><ellipse cx="11.2" cy="18.2" rx="2.9" ry="3.6" fill="#fff" transform="rotate(-18 11.2 18.2)"/><ellipse cx="16.4" cy="12.4" rx="2.9" ry="3.8" fill="#fff" transform="rotate(-6 16.4 12.4)"/><ellipse cx="23.6" cy="12.4" rx="2.9" ry="3.8" fill="#fff" transform="rotate(6 23.6 12.4)"/><ellipse cx="28.8" cy="18.2" rx="2.9" ry="3.6" fill="#fff" transform="rotate(18 28.8 18.2)"/></svg>{plhd_name}<span>Admin</span></a>
    <span class="st-grow"></span>
    <a class="st-who" id="st-who" href="AdminAccount"></a>
    <a class="st-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="st-out" onclick="AdminSettingsJs.signOut()">Sign out</button>
</header>
<aside class="st-side" id="st-nav" aria-label="Admin">
    <div class="st-nav-top"><span>Menu</span><button type="button" class="st-ibtn" aria-label="Close" onclick="AdminSettingsJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="st-amenu" id="st-menu"></ul>
</aside>
<div class="st-scrim" id="st-scrim" onclick="AdminSettingsJs.closeNav()"></div>
<main class="st-amain" id="st-main"><p class="st-loading">Loading&hellip;</p></main>
<div class="st-modal" id="st-modal" onclick="if(event.target===this)AdminSettingsJs.closeModal()">
    <div class="st-mbox" role="dialog" aria-modal="true"><button type="button" class="st-ibtn st-mclose" aria-label="Close" onclick="AdminSettingsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="st-mbody"></div></div>
</div>
<div class="st-toast" id="st-toast" role="status" aria-live="polite"></div>
</div>
