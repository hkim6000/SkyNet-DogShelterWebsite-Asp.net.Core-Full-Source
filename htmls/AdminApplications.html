<div class="ap-site ap-admin" id="ap-site" data-theme="light" style="{plhd_style}">
<header class="ap-ahead">
    <button type="button" class="ap-ibtn ap-burger" aria-label="Menu" onclick="AdminApplicationsJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="ap-abrand" href="Admin"><svg class="ap-logo" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="var(--ap-accent)"/><ellipse cx="20" cy="25.5" rx="7.2" ry="6" fill="#fff"/><ellipse cx="11.2" cy="18.2" rx="2.9" ry="3.6" fill="#fff" transform="rotate(-18 11.2 18.2)"/><ellipse cx="16.4" cy="12.4" rx="2.9" ry="3.8" fill="#fff" transform="rotate(-6 16.4 12.4)"/><ellipse cx="23.6" cy="12.4" rx="2.9" ry="3.8" fill="#fff" transform="rotate(6 23.6 12.4)"/><ellipse cx="28.8" cy="18.2" rx="2.9" ry="3.6" fill="#fff" transform="rotate(18 28.8 18.2)"/></svg>{plhd_name}<span>Admin</span></a>
    <span class="ap-grow"></span>
    <a class="ap-who" id="ap-who" href="AdminAccount"></a>
    <a class="ap-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="ap-out" onclick="AdminApplicationsJs.signOut()">Sign out</button>
</header>
<aside class="ap-side" id="ap-nav" aria-label="Admin">
    <div class="ap-nav-top"><span>Menu</span><button type="button" class="ap-ibtn" aria-label="Close" onclick="AdminApplicationsJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="ap-amenu" id="ap-menu"></ul>
</aside>
<div class="ap-scrim" id="ap-scrim" onclick="AdminApplicationsJs.closeNav()"></div>
<main class="ap-amain" id="ap-main"><p class="ap-loading">Loading&hellip;</p></main>
<div class="ap-modal" id="ap-modal" onclick="if(event.target===this)AdminApplicationsJs.closeModal()">
    <div class="ap-mbox" role="dialog" aria-modal="true"><button type="button" class="ap-ibtn ap-mclose" aria-label="Close" onclick="AdminApplicationsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="ap-mbody"></div></div>
</div>
<div class="ap-toast" id="ap-toast" role="status" aria-live="polite"></div>
</div>
